<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ambil Nomor — AntriSehat</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="dist/shared.js"></script>
    <script defer src="dist/ambil-antrian.js"></script>
  </head>
  <body class="auth-pending">
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="ambil-antrian.html">
          <span class="brand-mark">+</span>
          AntriSehat
        </a>

        <nav class="nav">
          <a href="index.html" data-staff-only hidden>Dashboard</a>
          <a href="operator.html" data-staff-only hidden>Operator</a>
          <a href="ambil-antrian.html" class="active">Ambil Nomor</a>
          <a href="layar.html">Layar Antrian</a>
        </nav>

        <div class="user-tools">
          <span class="account-name" id="accountName"></span>
          <a class="logout-link" id="logoutButton" href="login.html">Keluar</a>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="page-head">
        <div>
          <h1>Ambil nomor antrian</h1>
          <p>
            Pilih layanan dan prioritas. Petugas akan memanggil nomor sesuai urutan.
          </p>
        </div>
      </div>

      <div id="lastTicket" class="last-ticket" hidden>
        <div>
          Tiket terakhir:
          <strong id="lastTicketNumber">—</strong>
          <span id="lastTicketState" class="muted"></span>
        </div>
        <button type="button" id="viewLastTicket">Lihat tiket</button>
      </div>

      <p class="feedback" role="alert" id="visitorFeedback" hidden></p>
      <section class="visitor-board" id="visitorBoard" aria-label="Pilih layanan"></section>
    </main>

    <dialog id="ticketDialog" class="dialog ticket-dialog" aria-labelledby="receiptNumber">
      <div class="receipt">
        <div class="brand">
          <span class="brand-mark">+</span>
          AntriSehat
        </div>
        <div class="receipt-caption">NOMOR ANTRIAN</div>
        <div class="receipt-num" id="receiptNumber">—</div>
        <h2 id="receiptService">—</h2>
        <p id="receiptPriority" class="receipt-detail"></p>
        <p id="receiptDate" class="receipt-detail"></p>
        <p id="receiptStatus" class="receipt-detail"></p>
      </div>

      <div class="receipt-actions">
        <button type="button" class="btn btn-outline" id="closeTicket">Tutup</button>
        <button type="button" class="btn btn-primary" id="printTicket">Cetak tiket</button>
      </div>
    </dialog>
  </body>
</html>
